name: Deploy Chat web (EC2 staging)

on:
  push:
    branches: [dev]

concurrency:
  group: kolink-chat-ec2-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require EC2 secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_USER }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "Add GitHub secrets EC2_HOST, EC2_USER, EC2_SSH_KEY on this repo so a push to dev can SSH to staging."
            exit 1
          fi

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync web source and restart
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/src/kolink-chat-frontend/"
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash /home/ubuntu/src/kolink-chat-backend/deploy/sync-and-restart.sh web"
